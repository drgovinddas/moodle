<VirtualHost *:80>
    # Moodle 5.1 requires DocumentRoot to point to the /public directory
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable URL rewriting for Moodle's routing engine
        RewriteEngine On
        
        # If the file or directory exists, serve it directly
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        
        # Otherwise, route through index.php
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Deny access to parent directories
    <Directory /var/www/html>
        Require all denied
    </Directory>
    
    # Allow access only to public directory
    <Directory /var/www/html/public>
        Require all granted
    </Directory>
    
    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
